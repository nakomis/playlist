[project]
name = "playlist"
version = "0.1.0"
description = "Beat-matched continuous mixes from Plex libraries, written straight to swimming headphones"
license = "CC0-1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyloudnorm>=0.1.1",
    "mutagen>=1.47",
    # Pinned below 2: v2 renamed FastMCP.
    "mcp[cli]>=1.30,<2",
]

[project.scripts]
playlist = "playlist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playlist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=playlist --cov-report=term-missing --cov-fail-under=70"
